[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mck-ppt"
version = "2.4.1"
description = "Consulting-style, fully editable PowerPoint decks for AI agents: 62 layouts, native shapes, built-in QA gates (python-pptx)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Kaku Li" }]
requires-python = ">=3.8"
dependencies = ["python-pptx>=0.6.21", "lxml>=4.9"]
keywords = ["powerpoint", "pptx", "python-pptx", "ai-agent", "claude-skill", "mckinsey", "consulting", "slides", "presentation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
cover-image = ["Pillow>=9.0", "numpy>=1.24", "rembg>=2.0", "tencentcloud-sdk-python>=3.0"]

[project.urls]
Homepage = "https://github.com/likaku/Mck-ppt-design-skill"
Issues = "https://github.com/likaku/Mck-ppt-design-skill/issues"
Changelog = "https://github.com/likaku/Mck-ppt-design-skill/blob/main/CHANGELOG.md"

[project.scripts]
mck-ppt = "mck_ppt.__main__:main"

[tool.setuptools.packages.find]
include = ["mck_ppt*"]
